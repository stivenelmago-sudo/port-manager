name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Lint + Validate + Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install
      - run: node scripts/download-witr.js
      - run: npm run lint
      - run: npm run validate
      - run: npm test
