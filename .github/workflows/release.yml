name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Marketplace"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  build:
    name: Build & Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
          - win32-x64
          - win32-arm64
        include:
          - target: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64
            vsce: linux-x64
          - target: linux-arm64
            os: ubuntu-latest
            platform: linux
            arch: arm64
            vsce: linux-arm64
          - target: darwin-x64
            os: macos-latest
            platform: darwin
            arch: x64
            vsce: darwin-x64
          - target: darwin-arm64
            os: macos-latest
            platform: darwin
            arch: arm64
            vsce: darwin-arm64
          - target: win32-x64
            os: windows-latest
            platform: win32
            arch: x64
            vsce: win32-x64
          - target: win32-arm64
            os: windows-latest
            platform: win32
            arch: arm64
            vsce: win32-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Download WITR binaries
        shell: bash
        run: node scripts/download-witr.js

      - name: Run lint + validate + tests
        shell: bash
        run: |
          npm run lint
          npm run validate
          npm test

      - name: Build ${{ matrix.target }} VSIX
        shell: bash
        run: node scripts/build-platform.js --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: portpilot-${{ matrix.target }}
          path: portpilot-*.vsix
          if-no-files-found: error

  publish:
    name: Publish to Marketplace
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish each VSIX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          set -e
          for f in dist/portpilot-*/portpilot-*.vsix; do
            echo "Publishing $f"
            vsce publish -p "$VSCE_PAT" --packagePath "$f"
          done

  ci:
    name: CI (no publish)
    needs: build
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Builds passed — no Marketplace publish on non-tag pushes."
